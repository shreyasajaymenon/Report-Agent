name: Ventura CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Use Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Node Dependencies
      run: npm install
      
    - name: Install Python Dependencies
      run: pip install reportlab pandas matplotlib

    - name: Run Lint
      run: npm run lint

    - name: Run Unit Tests
      run: npm test

    - name: Run E2E Mock Pipeline (Demo Mode)
      run: npm run demo
